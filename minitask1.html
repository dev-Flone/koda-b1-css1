<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Layouting</title>

    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        height: 100vh;
      }
      h1 {
        position: relative;
        top: 10%;
        width: 100%;
        text-align: center;
      }
      .papan {
        width: 400px;
        height: 400px;
        border: 1px solid black;
        position: relative;
        top: 25%;
        font-size: 0;
        margin: auto;
      }

      .kotak {
        height: 50px;
        width: 50px;
        display: inline-block;
      }

      .row:nth-child(odd) .kotak:nth-child(odd),
      .row:nth-child(even) .kotak:nth-child(even) {
        background-color: darkgrey;
      }

      .row:nth-child(odd) .kotak:nth-child(even),
      .row:nth-child(even) .kotak:nth-child(odd) {
        background-color: black;
      }
    </style>
  </head>
  <body>
    <h1>Chess board with display and position</h1>
    <div class="papan">
      <div class="row">

        <div class="kotak"></div>
